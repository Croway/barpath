# Publishes the app to GitHub Pages on every push to main: fetches the pinned MediaPipe runtime and pose models
# (not in git), then uploads only the files the app serves. Tests, tools and videos stay out of the site.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Unit tests
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npm ci
          npm test
      - name: MediaPipe into vendor/
        run: ./tools/fetch-vendor.sh
      - name: The site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons locales vendor _site/
          du -sh _site
      - name: Smoke test the Pages artifact
        run: |
          node test/synth.mjs /tmp/barpath-smoke.mp4
          node test/e2e.mjs _site /tmp/barpath-smoke.mp4 /tmp/barpath-smoke.truth.json /tmp/barpath-smoke --at 0.4 --end 4 --pose off --check-offline
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
